<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pipsqueak</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="stage">
      <!-- column-reverse: the first child renders closest to the pet -->
      <div id="stack">
        <div id="chips" class="chips" hidden></div>
      </div>

      <div id="menu" class="menu" hidden></div>

      <!-- One panel, two jobs: the first-run welcome and the setup check.
           Both are rare, modal-ish, and want the same box. -->
      <section id="panel" class="panel" hidden>
        <header class="panel-head">
          <h1 id="panel-title"></h1>
          <button id="panel-close" class="icon close" type="button" title="Close">×</button>
        </header>
        <div id="panel-body"></div>
      </section>

      <!--
        The hint is ours rather than a `title`, because the operating system
        shows one of those after half a second, and half a second is short
        enough that it fires every time the cursor merely passes the pet.
      -->
      <p id="hint" class="hint" hidden>Click to hide the cards · right-click for options · drag to move</p>
      <canvas id="pet" width="96" height="96"></canvas>
    </main>

    <template id="card-template">
      <article class="card" data-state="idle">
        <header class="card-head">
          <span class="dot" aria-hidden="true"></span>
          <span class="project"></span>
          <span class="title"></span>
          <span class="line"></span>
          <span class="workspace" hidden></span>
          <span class="unread" hidden title="Finished while you were away">●</span>
          <span class="age"></span>
          <button class="icon focus" type="button" title="Open this chat">↗</button>
          <button class="icon close" type="button" title="Dismiss this card">×</button>
        </header>
        <p class="narration"></p>
        <p class="status">
          <span class="kind"></span>
          <span class="sep" aria-hidden="true">·</span>
          <span class="actions"></span>
          <span class="sep" aria-hidden="true">·</span>
          <span class="elapsed"></span>
          <span class="badges">
            <span class="chip subagents" hidden></span>
            <span class="chip blocked" hidden></span>
          </span>
        </p>
        <p class="ask" hidden>
          <span class="ask-what"></span>
          <span class="risk" hidden></span>
        </p>
        <div class="more" hidden>
          <p class="detail" hidden></p>
          <ol class="log"></ol>
        </div>
      </article>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
