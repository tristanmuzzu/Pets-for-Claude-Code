<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pipsqueak</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="stage">
      <!-- column-reverse: the first child renders closest to the pet -->
      <div id="stack">
        <div id="chips" class="chips" hidden></div>
      </div>

      <div id="menu" class="menu" hidden></div>

      <canvas id="pet" width="96" height="96" title="Pipsqueak — click to hide the cards, right-click for options, drag to move"></canvas>
    </main>

    <template id="card-template">
      <article class="card" data-state="idle">
        <header class="card-head">
          <span class="dot" aria-hidden="true"></span>
          <span class="project"></span>
          <span class="count" hidden></span>
          <span class="age"></span>
          <button class="close" type="button" title="Collapse this project">×</button>
        </header>
        <p class="headline"></p>
        <p class="live"><span class="live-text"></span><span class="burst" hidden></span></p>
        <div class="more" hidden>
          <p class="detail"></p>
          <ol class="log"></ol>
        </div>
      </article>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
