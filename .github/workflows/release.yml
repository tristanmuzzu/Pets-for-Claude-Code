name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Everything here fails in seconds. Doing it before the build means a
  # mismatched version number costs a coffee rather than a full toolchain run.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versions agree, and the release has notes
        run: node scripts/verify-release.mjs

  build:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify the sprite atlases are in sync with their generators
        run: |
          npm run sprites
          git diff --exit-code public/pets

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Pipsqueak ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: See docs/releases/${{ github.ref_name }}.md
          args: --bundles nsis,msi
