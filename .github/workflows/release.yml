name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Everything here fails in seconds. Doing it before the build means a
  # mismatched version number costs a coffee rather than a full toolchain run.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versions agree, and the release has notes
        run: node scripts/verify-release.mjs

  build:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # `tauri::generate_context!` embeds the frontend at compile time, so the
      # cargo steps below need dist/ to exist. tauri-action would build it, but
      # not until after these run.
      - run: npm run build

      - run: npm test

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # The same two gates `ci` runs. They were missing here, so a tag could —
      # and did, at v0.7.2 — build a green release out of a commit whose `ci`
      # run was red. A release workflow that is weaker than the branch check is
      # a release workflow that ships the thing the branch check refused.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Verify the sprite atlases are in sync with their generators
        run: |
          npm run sprites
          git diff --exit-code public/pets

      # The notes are already written, in the file `verify-release.mjs` insists
      # exists. Pointing at them from the release body meant everyone reading
      # the Releases page got the sentence "See docs/releases/v0.7.3.md"
      # instead of the release notes.
      - name: Take the release body from the notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<PIPSQUEAK_NOTES_EOF'
            cat "docs/releases/${{ github.ref_name }}.md"
            echo 'PIPSQUEAK_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Pipsqueak ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: ${{ steps.notes.outputs.body }}
          args: --bundles nsis,msi
