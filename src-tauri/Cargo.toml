[package]
name = "pipsqueak"
version = "0.4.0"
description = "A tiny desktop pet that shows what Claude Code is doing, at a glance."
authors = ["Tristan Rafe Muzzu"]
license = "MIT"
repository = "https://github.com/tristanmuzzu/pipsqueak"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api pairs with `macOSPrivateApi` in tauri.conf.json; it is what
# makes the window actually transparent on macOS and is inert elsewhere.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
