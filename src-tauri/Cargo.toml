[package]
name = "pipsqueak"
version = "0.1.0"
description = "A tiny desktop pet that shows what Claude Code is doing, at a glance."
authors = ["Tristan Rafe Muzzu"]
license = "MIT"
repository = "https://github.com/tristanmuzzu/pipsqueak"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
